openapi: 3.0.3
info:
  title: Restaurant Gardylafquen API
  version: 1.0.0
  description: >
    API REST pura para la gestión de productos, categorías, mesas, órdenes,
    meseros y ventas de Restaurant Gardylafquen.
servers:
  - url: http://localhost:8000/api/v1
    description: Entorno local (Docker)
paths:
  /health:
    get:
      summary: Estado de la API y conexión a base de datos
      operationId: getHealth
      tags:
        - System
      responses:
        "200":
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      summary: Listar categorías paginadas
      operationId: listCategories
      tags: [Categories]
      parameters:
        - name: filter[name]
          in: query
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, -id, name, -name, created_at, -created_at]
            default: -created_at
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        "200":
          description: Listado paginado de categorías
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCategories"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      summary: Crear una nueva categoría
      operationId: createCategory
      tags: [Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Categoría creada
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /categories/{category}:
    parameters:
      - name: category
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Obtener una categoría por ID
      operationId: getCategory
      tags: [Categories]
      responses:
        "200":
          description: Detalle de la categoría
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Actualizar una categoría
      operationId: replaceCategory
      tags: [Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      summary: Actualizar parcialmente una categoría
      operationId: updateCategory
      tags: [Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Eliminar una categoría
      operationId: deleteCategory
      tags: [Categories]
      responses:
        "204":
          description: Categoría eliminada
        "404":
          $ref: "#/components/responses/NotFound"
  /products:
    get:
      summary: Listar productos paginados
      operationId: listProducts
      tags: [Products]
      parameters:
        - name: filter[name]
          in: query
          schema: { type: string, maxLength: 150 }
        - name: filter[category_id]
          in: query
          schema: { type: integer, minimum: 1 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, -id, name, -name, price_cents, -price_cents, created_at, -created_at]
            default: -created_at
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        "200":
          description: Listado paginado de productos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      summary: Crear un nuevo producto
      operationId: createProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Producto creado
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "422":
          $ref: "#/components/responses/ValidationError"
  /products/{product}:
    parameters:
      - name: product
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Obtener un producto por ID
      operationId: getProduct
      tags: [Products]
      responses:
        "200":
          description: Detalle del producto
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Actualizar un producto
      operationId: replaceProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      summary: Actualizar parcialmente un producto
      operationId: updateProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Eliminar (soft-delete) un producto
      operationId: deleteProduct
      tags: [Products]
      responses:
        "204":
          description: Producto eliminado
        "404":
          $ref: "#/components/responses/NotFound"
  /products/{product}/image:
    parameters:
      - name: product
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      summary: Subir o reemplazar imagen de producto
      operationId: uploadProductImage
      tags: [Products]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Imagen actualizada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /waiters:
    get:
      summary: Listar meseros paginados
      operationId: listWaiters
      tags: [Waiters]
      parameters:
        - name: filter[name]
          in: query
          schema: { type: string, maxLength: 150 }
        - name: filter[is_active]
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, -id, name, -name, created_at, -created_at]
            default: -created_at
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        "200":
          description: Listado paginado de meseros
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedWaiters"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      summary: Crear un mesero
      operationId: createWaiter
      tags: [Waiters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaiterInput"
      responses:
        "201":
          description: Mesero creado
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Waiter"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /waiters/{waiter}:
    parameters:
      - name: waiter
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Obtener un mesero por ID
      operationId: getWaiter
      tags: [Waiters]
      responses:
        "200":
          description: Detalle del mesero
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Waiter"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Actualizar un mesero
      operationId: replaceWaiter
      tags: [Waiters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaiterInput"
      responses:
        "200":
          description: Mesero actualizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Waiter"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      summary: Actualizar parcialmente un mesero
      operationId: updateWaiter
      tags: [Waiters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaiterInput"
      responses:
        "200":
          description: Mesero actualizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Waiter"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Eliminar (soft-delete) un mesero
      operationId: deleteWaiter
      tags: [Waiters]
      responses:
        "204":
          description: Mesero eliminado
        "404":
          $ref: "#/components/responses/NotFound"
  /tables:
    get:
      summary: Listar mesas paginadas
      operationId: listTables
      tags: [Tables]
      parameters:
        - name: filter[status]
          in: query
          schema:
            type: string
            enum: [available, occupied, reserved, inactive]
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, -id, number, -number, capacity, -capacity, created_at, -created_at]
            default: number
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Listado paginado de mesas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTables"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      summary: Crear una mesa
      operationId: createTable
      tags: [Tables]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableInput"
      responses:
        "201":
          description: Mesa creada
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Table"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /tables/{table}:
    parameters:
      - name: table
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Obtener una mesa por ID
      operationId: getTable
      tags: [Tables]
      responses:
        "200":
          description: Detalle de la mesa
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Table"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Actualizar una mesa
      operationId: replaceTable
      tags: [Tables]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableInput"
      responses:
        "200":
          description: Mesa actualizada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Table"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      summary: Actualizar parcialmente una mesa
      operationId: updateTable
      tags: [Tables]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableInput"
      responses:
        "200":
          description: Mesa actualizada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Table"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Eliminar (soft-delete) una mesa
      operationId: deleteTable
      tags: [Tables]
      responses:
        "204":
          description: Mesa eliminada
        "404":
          $ref: "#/components/responses/NotFound"
  /orders:
    get:
      summary: Listar órdenes paginadas
      operationId: listOrders
      tags: [Orders]
      parameters:
        - name: filter[status]
          in: query
          schema: { type: string, enum: [waiting, served, paid, cancelled] }
        - name: filter[table_id]
          in: query
          schema: { type: integer, minimum: 1 }
        - name: filter[waiter_id]
          in: query
          schema: { type: integer, minimum: 1 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, -id, subtotal_cents, -subtotal_cents, created_at, -created_at]
            default: -created_at
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        "200":
          description: Listado paginado de órdenes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOrders"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      summary: Crear una nueva orden
      operationId: createOrder
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Orden creada
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Order"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /orders/{order}:
    parameters:
      - name: order
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Obtener una orden por ID
      operationId: getOrder
      tags: [Orders]
      responses:
        "200":
          description: Detalle de la orden
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Actualizar una orden activa
      operationId: replaceOrder
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "200":
          description: Orden actualizada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Eliminar (soft-delete) una orden no pagada
      operationId: deleteOrder
      tags: [Orders]
      responses:
        "204":
          description: Orden eliminada
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DomainConflict"
  /orders/{order}/status:
    parameters:
      - name: order
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      summary: Cambiar el estado de una orden activa
      operationId: updateOrderStatus
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  responses:
    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DomainConflict:
      description: Conflicto de regla de dominio
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      required: [status, service, database, timestamp]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string, example: restaurant-gardylafquen-api }
        database: { type: string, enum: [ok, error] }
        timestamp: { type: string, format: date-time }
    Category:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Bebidas }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 100, example: Bebidas }
    Product:
      type: object
      required: [id, name, description, category_id, price_cents, image_url, created_at, updated_at]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Salmón a la plancha }
        description: { type: string, nullable: true, maxLength: 500 }
        category_id: { type: integer, example: 2 }
        category:
          $ref: "#/components/schemas/Category"
        price_cents: { type: integer, minimum: 0, example: 1290000 }
        image_url: { type: string, format: uri, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    ProductInput:
      type: object
      required: [name, category_id, price_cents]
      properties:
        name: { type: string, minLength: 2, maxLength: 150 }
        category_id: { type: integer, minimum: 1 }
        price_cents: { type: integer, minimum: 0, maximum: 100000000 }
        description: { type: string, nullable: true, maxLength: 500 }
    PaginationLinks:
      type: object
      properties:
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
        prev: { type: string, nullable: true }
        next: { type: string, nullable: true }
    PaginationMeta:
      type: object
      required: [current_page, last_page, per_page, total]
      properties:
        current_page: { type: integer }
        from: { type: integer, nullable: true }
        last_page: { type: integer }
        path: { type: string }
        per_page: { type: integer }
        to: { type: integer, nullable: true }
        total: { type: integer }
    PaginatedCategories:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    PaginatedProducts:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    Waiter:
      type: object
      required: [id, name, email, is_active, created_at, updated_at]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Camila Rojas }
        email: { type: string, format: email, example: camila.rojas@example.test }
        is_active: { type: boolean, example: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    WaiterInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 2, maxLength: 150 }
        email: { type: string, format: email, maxLength: 255 }
        is_active: { type: boolean, default: true }
    PaginatedWaiters:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Waiter"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    Table:
      type: object
      required: [id, number, label, capacity, status, created_at, updated_at]
      properties:
        id: { type: integer, example: 1 }
        number: { type: integer, minimum: 1, example: 1 }
        label: { type: string, nullable: true, example: Salón }
        capacity: { type: integer, minimum: 1, example: 4 }
        status: { type: string, enum: [available, occupied, reserved, inactive] }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    TableInput:
      type: object
      required: [number]
      properties:
        number: { type: integer, minimum: 1, maximum: 9999 }
        capacity: { type: integer, minimum: 1, maximum: 50, default: 4 }
        status: { type: string, enum: [available, occupied, reserved, inactive], default: available }
        label: { type: string, nullable: true, maxLength: 100 }
    PaginatedTables:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Table"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    OrderItem:
      type: object
      required: [id, product_id, product_name, unit_price_cents, quantity, line_total_cents]
      properties:
        id: { type: integer }
        product_id: { type: integer }
        product_name: { type: string }
        unit_price_cents: { type: integer }
        quantity: { type: integer, minimum: 1 }
        line_total_cents: { type: integer }
    Order:
      type: object
      required: [id, table_id, waiter_id, status, notes, subtotal_cents, items, created_at, updated_at]
      properties:
        id: { type: integer }
        table_id: { type: integer }
        table:
          $ref: "#/components/schemas/Table"
        waiter_id: { type: integer }
        waiter:
          $ref: "#/components/schemas/Waiter"
        status: { type: string, enum: [waiting, served, paid, cancelled] }
        notes: { type: string, nullable: true, maxLength: 500 }
        subtotal_cents: { type: integer, minimum: 0 }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    OrderItemInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 1, maximum: 999 }
    OrderInput:
      type: object
      required: [table_id, waiter_id, items]
      properties:
        table_id: { type: integer, minimum: 1 }
        waiter_id: { type: integer, minimum: 1 }
        notes: { type: string, nullable: true, maxLength: 500 }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
    OrderStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [waiting, served, cancelled] }
    PaginatedOrders:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    ErrorResponse:
      type: object
      required: [message, code]
      properties:
        message: { type: string }
        code: { type: string, example: validation_error }
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
