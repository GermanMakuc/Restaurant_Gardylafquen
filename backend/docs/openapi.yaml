openapi: 3.0.3
info:
  title: Restaurant Gardylafquen API
  version: 1.0.0
  description: >
    API REST pura para la gestión de productos, categorías, mesas, órdenes,
    meseros y ventas de Restaurant Gardylafquen.
servers:
  - url: http://localhost:8000/api/v1
    description: Entorno local (Docker)
paths:
  /health:
    get:
      summary: Estado de la API y conexión a base de datos
      operationId: getHealth
      tags:
        - System
      responses:
        "200":
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      summary: Listar categorías paginadas
      operationId: listCategories
      tags: [Categories]
      parameters:
        - name: filter[name]
          in: query
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, -id, name, -name, created_at, -created_at]
            default: -created_at
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        "200":
          description: Listado paginado de categorías
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCategories"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      summary: Crear una nueva categoría
      operationId: createCategory
      tags: [Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Categoría creada
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /categories/{category}:
    parameters:
      - name: category
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Obtener una categoría por ID
      operationId: getCategory
      tags: [Categories]
      responses:
        "200":
          description: Detalle de la categoría
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Actualizar una categoría
      operationId: replaceCategory
      tags: [Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      summary: Actualizar parcialmente una categoría
      operationId: updateCategory
      tags: [Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DomainConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Eliminar una categoría
      operationId: deleteCategory
      tags: [Categories]
      responses:
        "204":
          description: Categoría eliminada
        "404":
          $ref: "#/components/responses/NotFound"
  /products:
    get:
      summary: Listar productos paginados
      operationId: listProducts
      tags: [Products]
      parameters:
        - name: filter[name]
          in: query
          schema: { type: string, maxLength: 150 }
        - name: filter[category_id]
          in: query
          schema: { type: integer, minimum: 1 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, -id, name, -name, price_cents, -price_cents, created_at, -created_at]
            default: -created_at
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        "200":
          description: Listado paginado de productos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      summary: Crear un nuevo producto
      operationId: createProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Producto creado
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "422":
          $ref: "#/components/responses/ValidationError"
  /products/{product}:
    parameters:
      - name: product
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Obtener un producto por ID
      operationId: getProduct
      tags: [Products]
      responses:
        "200":
          description: Detalle del producto
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Actualizar un producto
      operationId: replaceProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      summary: Actualizar parcialmente un producto
      operationId: updateProduct
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Eliminar (soft-delete) un producto
      operationId: deleteProduct
      tags: [Products]
      responses:
        "204":
          description: Producto eliminado
        "404":
          $ref: "#/components/responses/NotFound"
  /products/{product}/image:
    parameters:
      - name: product
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      summary: Subir o reemplazar imagen de producto
      operationId: uploadProductImage
      tags: [Products]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Imagen actualizada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  responses:
    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DomainConflict:
      description: Conflicto de regla de dominio
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      required: [status, service, database, timestamp]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string, example: restaurant-gardylafquen-api }
        database: { type: string, enum: [ok, error] }
        timestamp: { type: string, format: date-time }
    Category:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Bebidas }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 100, example: Bebidas }
    Product:
      type: object
      required: [id, name, description, category_id, price_cents, image_url, created_at, updated_at]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Salmón a la plancha }
        description: { type: string, nullable: true, maxLength: 500 }
        category_id: { type: integer, example: 2 }
        category:
          $ref: "#/components/schemas/Category"
        price_cents: { type: integer, minimum: 0, example: 1290000 }
        image_url: { type: string, format: uri, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    ProductInput:
      type: object
      required: [name, category_id, price_cents]
      properties:
        name: { type: string, minLength: 2, maxLength: 150 }
        category_id: { type: integer, minimum: 1 }
        price_cents: { type: integer, minimum: 0, maximum: 100000000 }
        description: { type: string, nullable: true, maxLength: 500 }
    PaginationLinks:
      type: object
      properties:
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
        prev: { type: string, nullable: true }
        next: { type: string, nullable: true }
    PaginationMeta:
      type: object
      required: [current_page, last_page, per_page, total]
      properties:
        current_page: { type: integer }
        from: { type: integer, nullable: true }
        last_page: { type: integer }
        path: { type: string }
        per_page: { type: integer }
        to: { type: integer, nullable: true }
        total: { type: integer }
    PaginatedCategories:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    PaginatedProducts:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    ErrorResponse:
      type: object
      required: [message, code]
      properties:
        message: { type: string }
        code: { type: string, example: validation_error }
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
