services:
  backend:
    build: ./backend
    container_name: gardylafquen_backend
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8000}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-4321}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-4321}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-restaurant}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-restaurant}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      RUN_MIGRATIONS: "true"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: gardylafquen_frontend
    ports:
      - "${FRONTEND_PORT:-4321}:4321"
    environment:
      PUBLIC_API_URL: http://localhost:${APP_PORT:-8000}/api/v1
      API_INTERNAL_URL: http://backend/api/v1
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: gardylafquen_db
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8 --collation-server=utf8_unicode_ci
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-restaurant}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-restaurant}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
  backend_vendor:
  frontend_node_modules:
